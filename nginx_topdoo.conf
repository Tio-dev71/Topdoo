server {
    server_name topdoo.com www.topdoo.com 157.66.100.35;
    root /var/www/topdoo;
    index index.html;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/9router/ {
        proxy_pass http://127.0.0.1:20128/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer sk-tiodev-chatbot-secret";
        proxy_cache_bypass $http_upgrade;
    }

    location /api/voicebox/ {
        proxy_pass http://127.0.0.1:17493/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/topdoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topdoo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name topdoo.com www.topdoo.com 157.66.100.35;
    return 301 https://$host$request_uri;
}
